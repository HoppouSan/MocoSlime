[package]
name = "mocoslime"
version = "0.1.0"
edition = "2021"
description = "Mocoslime — native Windows Sony Mocopi bridge for SlimeVR"
license = "MIT"

[workspace]
resolver = "2"
members = [
    "crates/mocopi-protocol",
    "crates/tracking-core",
    "crates/slimevr-protocol",
    "crates/configuration",
    "crates/mocopi-ble-windows",
    "crates/mocoslime-core",
    "crates/ffi",
]

[dev-dependencies]
mocopi-protocol = { path = "crates/mocopi-protocol" }
tracking-core = { path = "crates/tracking-core" }
slimevr-protocol = { path = "crates/slimevr-protocol" }
configuration = { path = "crates/configuration" }
nalgebra = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
half = "2.4"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"
winreg = "0.52"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
nalgebra = "0.32"
parking_lot = "0.12"
async-trait = "0.1.76"
