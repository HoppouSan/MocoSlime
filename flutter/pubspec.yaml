name: mocoslime
description: Mocoslime - Native Windows Sony Mocopi Bridge for SlimeVR
version: 0.1.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.0
  provider: ^6.1.1
  json_annotation: ^4.8.1
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  window_manager: ^0.3.8
  system_tray: ^2.0.3
  permission_handler: ^11.0.1
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
