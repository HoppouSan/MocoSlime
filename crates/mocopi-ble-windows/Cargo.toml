[package]
name = "mocopi-ble-windows"
version = "0.1.1"
edition = "2021"
description = "Native Windows BLE implementation using WinRT APIs"
license = "MIT"

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
mocopi-protocol = { path = "../mocopi-protocol" }
tracking-core = { path = "../tracking-core" }
configuration = { path = "../configuration" }
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
