[package]
name = "moslime-core"
version = "0.1.0"
edition = "2021"
description = "Mocoslime tracking core: tracker management, state machines, SlimeVR output"
license = "MIT"

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }
async-trait = { workspace = true }
mocopi-protocol = { path = "../mocopi-protocol" }
tracking-core = { path = "../tracking-core" }
slimevr-protocol = { path = "../slimevr-protocol" }
mocopi-ble-windows = { path = "../mocopi-ble-windows" }
configuration = { path = "../configuration" }
nalgebra = { workspace = true }
